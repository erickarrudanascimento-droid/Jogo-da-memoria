
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Memory</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    background-color: #579447;
    background-image:
        repeating-linear-gradient(45deg,
        rgba(30,80,20,.12) 0 8px,
        transparent 8px 16px);
}

.screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

h1 {
    font-size: clamp(30px, 5vw, 55px);
    text-shadow: 4px 4px #315d29;
    margin: 15px;
}

h2 {
    text-shadow: 2px 2px #315d29;
}

p {
    font-size: 19px;
}

button {
    background: #65a943;
    color: white;
    border: 4px solid #315d29;
    padding: 15px 35px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px #315d29;
    margin: 10px;
}

button:hover {
    background: #85c85b;
    transform: translateY(-2px);
}

button:active {
    transform: translateY(3px);
    box-shadow: none;
}

#game {
    display: none;
    padding: 10px;
}

.info {
    display: flex;
    justify-content: center;
    gap: 35px;
    font-size: 20px;
    font-weight: bold;
    flex-wrap: wrap;
    margin: 10px;
}

.board {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: clamp(4px, 1vw, 12px);
    width: min(94vw, 850px);
    margin: 15px auto;
}

.card {
    aspect-ratio: 1 / 1;
    min-width: 0;
    border: 4px solid #654321;
    background-color: #69a94a;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px #315d29;
    transition: transform .2s;
}

.card:hover {
    transform: scale(1.04);
}

.card-back {
    width: 100%;
    height: 100%;
    background-color: #68a844;
    background-image:
        repeating-linear-gradient(0deg,
        transparent 0 12px,
        rgba(30,80,20,.2) 12px 15px),
        repeating-linear-gradient(90deg,
        transparent 0 12px,
        rgba(30,80,20,.18) 12px 15px);
}

.card-front {
    display: none;
    width: 100%;
    height: 100%;
    background-image: url("dasd.jpg");
    background-size: 500% 800%;
    background-repeat: no-repeat;
    background-position: 0% 0%;
}

.card.revealed .card-back,
.card.matched .card-back {
    display: none;
}

.card.revealed .card-front,
.card.matched .card-front {
    display: block;
}

.card.matched {
    border-color: #d9ff8b;
    box-shadow: 0 0 10px #d9ff8b;
    cursor: default;
}

#victory {
    display: none;
}

#menu {
    display: flex;
}

.small {
    font-size: 14px;
    margin-top: 20px;
}

@media (max-width: 600px) {
    .board {
        width: 98vw;
        gap: 3px;
    }

    .card {
        border-width: 2px;
    }

    .info {
        font-size: 15px;
        gap: 12px;
    }

    button {
        font-size: 16px;
        padding: 12px 20px;
    }
}
</style>
</head>

<body>

<!-- MENU INICIAL -->
<section id="menu" class="screen">

    <h1>⛏ MINECRAFT MEMORY ⛏</h1>

    <h2>Teste sua memória!</h2>

    <p>Encontre os 20 pares de itens e personagens.</p>

    <button onclick="startGame()">
        ▶ JOGAR
    </button>

    <p class="small">
        Minecraft Memory Edition
    </p>

</section>

<!-- JOGO -->
<section id="game">

    <h1>⛏ ENCONTRE OS PARES! ⛏</h1>

    <div class="info">
        <span id="attempts">Tentativas: 0</span>
        <span id="pairs">Pares: 0/20</span>
    </div>

    <div class="board" id="board"></div>

    <button onclick="backMenu()">
        VOLTAR AO MENU
    </button>

</section>

<!-- VITÓRIA -->
<section id="victory" class="screen">

    <h1>🏆 VITÓRIA! 🏆</h1>

    <h2>Você encontrou todos os pares!</h2>

    <p id="finalAttempts"></p>

    <h2>Você é um verdadeiro mestre do Minecraft! ⛏</h2>

    <button onclick="startGame()">
        JOGAR NOVAMENTE
    </button>

    <button onclick="backMenu()">
        MENU INICIAL
    </button>

</section>

<script>

// GRUPOS DE PARES DA IMAGEM
const groups = [
    [0,1], [2,3], [4,9],
    [5,6], [7,8], [10,11],
    [12,13], [14,19], [15,16],
    [17,18], [20,21], [22,23],
    [24,29], [25,26], [27,28],
    [30,31], [32,33], [34,39],
    [35,36], [37,38]
];

let cards = [];
let firstCard = null;
let locked = false;
let attempts = 0;
let pairs = 0;
let matched = 0;

// CRIAR CARTAS
function createCards() {

    cards = [];

    groups.forEach((group, id) => {

        group.forEach(index => {

            cards.push({
                id: id,
                image: index
            });

        });

    });

    cards.sort(() => Math.random() - 0.5);
}

// INICIAR JOGO
function startGame() {

    document.getElementById("menu").style.display = "none";
    document.getElementById("victory").style.display = "none";
    document.getElementById("game").style.display = "block";

    attempts = 0;
    pairs = 0;
    matched = 0;
    firstCard = null;
    locked = false;

    updateInfo();
    createCards();

    const board = document.getElementById("board");
    board.innerHTML = "";

    cards.forEach((card, index) => {

        const element = document.createElement("div");
        element.className = "card";

        const back = document.createElement("div");
        back.className = "card-back";

        const front = document.createElement("div");
        front.className = "card-front";

        // POSIÇÃO CORRETA NA IMAGEM SPRITE
        const column = card.image % 5;
        const row = Math.floor(card.image / 5);

        const x = (column / 4) * 100;
        const y = (row / 7) * 100;

        front.style.backgroundPosition = `${x}% ${y}%`;

        element.appendChild(back);
        element.appendChild(front);

        element.addEventListener("click", () => {
            flipCard(element, index);
        });

        board.appendChild(element);

    });
}

// VIRAR CARTA
function flipCard(element, index) {

    if (
        locked ||
        element.classList.contains("revealed") ||
        element.classList.contains("matched")
    ) {
        return;
    }

    element.classList.add("revealed");

    if (firstCard === null) {

        firstCard = {
            element: element,
            index: index
        };

    } else {

        attempts++;

        const secondCard = {
            element: element,
            index: index
        };

        locked = true;

        if (
            cards[firstCard.index].id ===
            cards[secondCard.index].id
        ) {

            firstCard.element.classList.add("matched");
            secondCard.element.classList.add("matched");

            firstCard = null;
            locked = false;

            pairs++;
            matched += 2;

            updateInfo();

            if (matched === 40) {
                setTimeout(victory, 700);
            }

        } else {

            updateInfo();

            setTimeout(() => {

                firstCard.element.classList.remove("revealed");
                secondCard.element.classList.remove("revealed");

                firstCard = null;
                locked = false;

            }, 1000);

        }

    }
}

// ATUALIZAR INFORMAÇÕES
function updateInfo() {

    document.getElementById("attempts").textContent =
        "Tentativas: " + attempts;

    document.getElementById("pairs").textContent =
        "Pares: " + pairs + "/20";

}

// TELA DE VITÓRIA
function victory() {

    document.getElementById("game").style.display = "none";
    document.getElementById("victory").style.display = "flex";

    document.getElementById("finalAttempts").textContent =
        "Você precisou de " + attempts + " tentativas!";

}

// VOLTAR AO MENU
function backMenu() {

    document.getElementById("game").style.display = "none";
    document.getElementById("victory").style.display = "none";
    document.getElementById("menu").style.display = "flex";

}

// TELA CHEIA
function fullscreen() {

    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }

}

// TECLA F11
document.addEventListener("keydown", event => {

    if (event.key === "F11") {
        event.preventDefault();
        fullscreen();
    }

});

</script>

</body>
</html>


<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Memory</title>
<style>
:root {
    --navy: #06243f;
    --blue: #0879bd;
    --cyan: #42e8f5;
    --ice: #eafaff;
    --white: #ffffff;
    --panel: rgba(4, 35, 65, .82);
    --shadow: #02172c;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: var(--white);
    text-align: center;
    background:
      radial-gradient(circle at 20% 10%, rgba(66,232,245,.26), transparent 35%),
      radial-gradient(circle at 80% 90%, rgba(8,121,189,.45), transparent 38%),
      linear-gradient(135deg, #061b35, #075a91 55%, #07365c);
    background-attachment: fixed;
}
.screen {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 22px;
}
h1 {
    font-size: clamp(30px, 5vw, 58px);
    text-shadow: 0 4px 0 #03223d, 0 0 22px rgba(66,232,245,.35);
    margin: 12px;
}
h2 { text-shadow: 0 2px 8px #03223d; }
p { font-size: 18px; }
.panel {
    background: var(--panel); border: 2px solid rgba(66,232,245,.55);
    border-radius: 18px; padding: 22px; width: min(94vw, 650px);
    box-shadow: 0 14px 35px rgba(0,0,0,.28), 0 0 18px rgba(66,232,245,.12);
}
button, select {
    background: linear-gradient(135deg, #12a4df, #0879bd);
    color: white; border: 2px solid var(--cyan); border-radius: 12px;
    padding: 12px 22px; font-size: 17px; font-weight: bold;
    cursor: pointer; margin: 8px; box-shadow: 0 4px 0 #03436e;
}
button:hover { filter: brightness(1.15); transform: translateY(-2px); }
button:active { transform: translateY(2px); box-shadow: none; }
select { background: #06385f; }
label { display: inline-flex; gap: 9px; align-items: center; margin: 10px; font-size: 17px; }
input[type="checkbox"] { accent-color: var(--cyan); width: 18px; height: 18px; }
#game { display: none; padding: 12px 10px 24px; }
.info {
    display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;
    margin: 12px auto; font-size: 18px; font-weight: bold;
}
.stat {
    background: rgba(2,29,54,.72); border: 1px solid rgba(66,232,245,.55);
    padding: 9px 16px; border-radius: 12px; min-width: 120px;
}
.board {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: clamp(5px, 1vw, 12px); width: min(94vw, 850px);
    margin: 15px auto;
}
.card {
    aspect-ratio: 1/1; min-width: 0; border: 3px solid #41d9ed;
    border-radius: 9px; background: #0879bd; cursor: pointer; position: relative;
    overflow: hidden; box-shadow: 0 4px #03375d, 0 0 8px rgba(66,232,245,.14);
    transition: transform .18s, box-shadow .18s, border-color .18s;
    transform-style: preserve-3d;
}
.card:hover:not(.revealed):not(.matched) { transform: scale(1.035); box-shadow: 0 4px #03375d, 0 0 14px var(--cyan); }
.card-back, .card-front {
    position: absolute; inset: 0; width: 100%; height: 100%;
    transition: opacity .22s ease, transform .25s ease;
}
.card-back {
    background-color: #0879bd;
    background-image:
      repeating-linear-gradient(0deg, transparent 0 12px, rgba(255,255,255,.12) 12px 14px),
      repeating-linear-gradient(90deg, transparent 0 12px, rgba(66,232,245,.17) 12px 14px);
    opacity: 1; transform: scale(1);
}
.card-front {
    display: none; background-image: url("dasd-cortada.jpg");
    background-size: 500% 800%; background-repeat: no-repeat;
    opacity: 0; transform: rotateY(90deg) scale(.82);
}
.card.revealed .card-back, .card.matched .card-back { opacity: 0; transform: scale(.75); }
.card.revealed .card-front, .card.matched .card-front {
    display: block; opacity: 1; transform: rotateY(0) scale(1);
    animation: cardReveal .28s ease-out;
}
.card.matched {
    border-color: #ffffff; box-shadow: 0 0 14px #42e8f5;
    cursor: default; animation: matchedPulse .55s ease-out;
}
@keyframes cardReveal { from { transform: rotateY(80deg) scale(.75); opacity: .2; } to { transform: rotateY(0) scale(1); opacity: 1; } }
@keyframes matchedPulse { 0% { transform: scale(1); } 45% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes titleGlow { 0%,100% { text-shadow: 0 4px 0 #03223d, 0 0 12px rgba(66,232,245,.25); } 50% { text-shadow: 0 4px 0 #03223d, 0 0 28px rgba(66,232,245,.65); } }
h1 { animation: titleGlow 3s infinite; }
#victory { display: none; }
.small { font-size: 14px; color: var(--ice); margin-top: 18px; }
#bestRecord { margin-top: 8px; }

/* MENU INSPIRADO NA INTERFACE PIXELADA DO MINECRAFT */
.menu-scene {
    position: relative;
    width: min(96vw, 900px);
    min-height: min(88vh, 720px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: clamp(24px, 5vh, 50px) 18px 25px;
    overflow: hidden;
    border: 4px solid #a6efff;
    border-radius: 4px;
    background:
      linear-gradient(180deg, rgba(3,24,46,.12) 0%, rgba(3,24,46,.22) 34%, rgba(2,19,39,.85) 70%, #03172c 100%),
      repeating-linear-gradient(0deg, transparent 0 42px, rgba(255,255,255,.035) 42px 44px),
      repeating-linear-gradient(90deg, transparent 0 42px, rgba(255,255,255,.035) 42px 44px),
      linear-gradient(145deg, #30b9e8 0%, #1265a1 35%, #07355c 66%, #061c38 100%);
    box-shadow: 0 0 30px rgba(66,232,245,.3), inset 0 0 35px rgba(0,0,0,.25);
}
.menu-scene::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: .24;
    background:
      linear-gradient(135deg, transparent 48%, #9df7ff 49% 51%, transparent 52%),
      repeating-linear-gradient(0deg, transparent 0 68px, rgba(0,0,0,.22) 68px 72px);
}
.menu-logo, .menu-buttons { position: relative; z-index: 1; width: 100%; }
.menu-logo { margin-top: 4vh; }
.logo-pickaxe {
    font-size: clamp(44px, 7vw, 78px);
    filter: drop-shadow(4px 5px 0 #05365d);
    margin-bottom: -8px;
}
.logo-title {
    font-family: Impact, "Arial Black", sans-serif;
    font-size: clamp(40px, 8vw, 86px);
    letter-spacing: 3px;
    color: #f5fdff;
    -webkit-text-stroke: 2px #075282;
    text-shadow: 0 5px 0 #03416a, 0 9px 0 #022b4c, 4px 7px 10px #00172a;
    line-height: 1;
}
.logo-subtitle {
    color: #6af4ff;
    font-size: clamp(22px, 4vw, 38px);
    font-weight: 1000;
    letter-spacing: 5px;
    text-shadow: 0 3px #03416a, 0 0 15px #36e9ff;
    margin-top: 8px;
}
.logo-tag {
    display: inline-block;
    margin-top: 14px;
    padding: 6px 18px;
    border: 2px solid #b8faff;
    background: rgba(2,35,62,.75);
    font-weight: 900;
    letter-spacing: 2px;
    font-size: 13px;
}
.menu-buttons { max-width: 520px; margin-top: 24px; }
.menu-scene button {
    border-radius: 2px;
    border: 3px solid #b5f7ff;
    background: linear-gradient(#168fca, #075b95);
    box-shadow: 0 5px 0 #02365e, inset 0 2px rgba(255,255,255,.25);
    text-shadow: 1px 2px #03416a;
    letter-spacing: 1px;
}
.menu-scene button:hover {
    background: linear-gradient(#29c5ed, #0b79b9);
    box-shadow: 0 5px 0 #02365e, 0 0 16px #4beaff;
}
.main-menu-button {
    display: block;
    width: min(100%, 420px);
    margin: 0 auto 18px !important;
    padding: 18px 25px !important;
    font-size: clamp(22px, 3vw, 30px) !important;
}
.menu-settings {
    border: 2px solid rgba(174,246,255,.55);
    background: rgba(2,24,45,.78);
    padding: 12px;
}
.setting-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    font-weight: bold;
    color: #d8fbff;
}
.setting-row select {
    max-width: 100%;
    font-size: 14px;
    border-radius: 2px;
    border: 2px solid #83edff;
}
.sound-row { margin-top: 8px; }
.sound-row label { margin: 5px; }
#bestRecord {
    margin: 15px 0 5px;
    font-weight: bold;
    color: #dffcff;
    text-shadow: 0 2px #03223d;
}
.menu-footer {
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #9cefff;
    margin-top: 15px;
}
@media (max-width: 600px) {
    .menu-scene { min-height: 86vh; padding: 28px 12px 18px; }
    .logo-title { letter-spacing: 1px; }
    .logo-subtitle { letter-spacing: 3px; }
    .setting-row select { width: 100%; }
}
@media (max-width: 600px) {
    .board { width: 98vw; gap: 4px; grid-template-columns: repeat(4, minmax(0,1fr)); }
    .card { border-width: 2px; }
    .info { font-size: 14px; gap: 7px; }
    .stat { min-width: unset; padding: 7px 10px; }
    button, select { font-size: 15px; padding: 10px 14px; }
}
</style>
</head>
<body>

<section id="menu" class="screen">
  <div class="menu-scene">
    <div class="menu-logo">
      <div class="logo-pickaxe">⛏</div>
      <div class="logo-title">MINECRAFT</div>
      <div class="logo-subtitle">MEMORY QUEST</div>
      <div class="logo-tag">EDIÇÃO MEMÓRIA</div>
    </div>

    <div class="menu-buttons">
      <button class="main-menu-button" onclick="startGame()">▶ JOGAR</button>
      <div class="menu-settings">
        <div class="setting-row">
          <span>⚔ DIFICULDADE</span>
          <select id="difficulty">
            <option value="10">FÁCIL — 10 PARES</option>
            <option value="15">MÉDIO — 15 PARES</option>
            <option value="20" selected>DIFÍCIL — 20 PARES</option>
          </select>
        </div>
        <div class="setting-row sound-row">
          <label><input id="soundToggle" type="checkbox" checked> 🔊 SONS ATIVADOS</label>
        </div>
      </div>
      <p id="bestRecord">Recorde: --</p>
      <p class="menu-footer">ENCONTRE OS PARES • TREINE SUA MEMÓRIA</p>
    </div>
  </div>
</section>

<section id="game">
  <h1>⛏ ENCONTRE OS PARES! ⛏</h1>
  <div class="info">
    <span class="stat" id="attempts">Tentativas: 0</span>
    <span class="stat" id="pairs">Pares: 0/20</span>
    <span class="stat" id="timer">Tempo: 00:00</span>
  </div>
  <div class="board" id="board"></div>
  <button onclick="startGame()">↻ REINICIAR</button>
  <button onclick="backMenu()">⌂ MENU</button>
</section>

<section id="victory" class="screen">
  <div class="panel">
    <h1>🏆 VITÓRIA! 🏆</h1>
    <h2>Você encontrou todos os pares!</h2>
    <p id="finalStats"></p>
    <h2 id="recordMessage"></h2>
    <button onclick="startGame()">JOGAR NOVAMENTE</button>
    <button onclick="backMenu()">MENU INICIAL</button>
  </div>
</section>

<script>
const groups = [
  [0,1], [2,3], [4,9], [5,6], [7,8],
  [10,11], [12,13], [14,19], [15,16], [17,18],
  [20,21], [22,23], [24,29], [25,26], [27,28],
  [30,31], [32,33], [34,39], [35,36], [37,38]
];

let cards = [], firstCard = null, locked = false;
let attempts = 0, pairs = 0, matched = 0;
let seconds = 0, timerInterval = null, gameFinished = false;
let activePairs = 20;

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function playSound(type) {
  if (!document.getElementById("soundToggle").checked) return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    const notes = { flip: [440, .07], match: [660, .14], wrong: [180, .2], win: [880, .28] };
    const [freq, duration] = notes[type] || notes.flip;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type === "wrong" ? "triangle" : "sine";
    osc.frequency.value = freq;
    if (type === "win") {
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(1175, ctx.currentTime + duration);
    }
    gain.gain.setValueAtTime(.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + duration);
    osc.onended = () => ctx.close();
  } catch(e) {}
}

function formatTime(total) {
  const mins = Math.floor(total / 60).toString().padStart(2, "0");
  const secs = (total % 60).toString().padStart(2, "0");
  return `${mins}:${secs}`;
}

function getRecordKey() {
  return "minecraftMemoryRecord_" + document.getElementById("difficulty").value;
}

function showRecord() {
  const record = localStorage.getItem(getRecordKey());
  document.getElementById("bestRecord").textContent = record
    ? `Recorde (${document.getElementById("difficulty").selectedOptions[0].text}): ${record}`
    : "Recorde: ainda não definido";
}
document.getElementById("difficulty").addEventListener("change", showRecord);
showRecord();

function createCards() {
  cards = [];
  const chosenGroups = groups.slice(0, activePairs);
  chosenGroups.forEach((group, id) => {
    group.forEach(imageIndex => cards.push({ id, image: imageIndex }));
  });
  shuffle(cards);
}

function startTimer() {
  clearInterval(timerInterval);
  seconds = 0;
  document.getElementById("timer").textContent = "Tempo: 00:00";
  timerInterval = setInterval(() => {
    if (gameFinished) return;
    seconds++;
    document.getElementById("timer").textContent = "Tempo: " + formatTime(seconds);
  }, 1000);
}

function startGame() {
  activePairs = Number(document.getElementById("difficulty").value);
  document.getElementById("menu").style.display = "none";
  document.getElementById("victory").style.display = "none";
  document.getElementById("game").style.display = "block";
  attempts = pairs = matched = 0;
  firstCard = null; locked = false; gameFinished = false;
  updateInfo(); createCards(); startTimer();

  const board = document.getElementById("board");
  board.innerHTML = "";
  cards.forEach((card, index) => {
    const element = document.createElement("div");
    element.className = "card";
    const back = document.createElement("div");
    back.className = "card-back";
    const front = document.createElement("div");
    front.className = "card-front";

    const column = card.image % 5;
    const row = Math.floor(card.image / 5);
    front.style.backgroundPosition = `${(column / 4) * 100}% ${(row / 7) * 100}%`;

    element.append(back, front);
    element.addEventListener("click", () => flipCard(element, index));
    board.appendChild(element);
  });
}

function flipCard(element, index) {
  if (locked || gameFinished || element.classList.contains("revealed") || element.classList.contains("matched")) return;
  element.classList.add("revealed");
  playSound("flip");

  if (firstCard === null) {
    firstCard = { element, index };
    return;
  }

  attempts++;
  const secondCard = { element, index };
  locked = true;

  if (cards[firstCard.index].id === cards[secondCard.index].id) {
    firstCard.element.classList.add("matched");
    secondCard.element.classList.add("matched");
    firstCard = null; locked = false;
    pairs++; matched += 2;
    playSound("match");
    updateInfo();
    if (matched === activePairs * 2) setTimeout(victory, 650);
  } else {
    playSound("wrong");
    updateInfo();
    setTimeout(() => {
      firstCard.element.classList.remove("revealed");
      secondCard.element.classList.remove("revealed");
      firstCard = null; locked = false;
    }, 850);
  }
}

function updateInfo() {
  document.getElementById("attempts").textContent = "Tentativas: " + attempts;
  document.getElementById("pairs").textContent = `Pares: ${pairs}/${activePairs}`;
}

function victory() {
  if (gameFinished) return;
  gameFinished = true;
  clearInterval(timerInterval);
  playSound("win");
  document.getElementById("game").style.display = "none";
  document.getElementById("victory").style.display = "flex";
  document.getElementById("finalStats").textContent = `Você venceu em ${attempts} tentativas e ${formatTime(seconds)}!`;

  const key = getRecordKey();
  const previous = localStorage.getItem(key);
  const currentRecord = `${formatTime(seconds)} — ${attempts} tentativas`;
  let newRecord = false;
  if (!previous) newRecord = true;
  else {
    const oldTime = previous.split(" — ")[0].split(":").reduce((a,v)=>a*60+Number(v),0);
    const oldAttempts = Number(previous.match(/(\d+) tentativas/)?.[1] || Infinity);
    newRecord = seconds < oldTime || (seconds === oldTime && attempts < oldAttempts);
  }
  if (newRecord) localStorage.setItem(key, currentRecord);
  document.getElementById("recordMessage").textContent = newRecord ? "✨ NOVO RECORDE! ✨" : `Recorde: ${localStorage.getItem(key)}`;
  showRecord();
}

function backMenu() {
  clearInterval(timerInterval);
  gameFinished = true;
  document.getElementById("game").style.display = "none";
  document.getElementById("victory").style.display = "none";
  document.getElementById("menu").style.display = "flex";
  showRecord();
}
</script>
</body>
</html>
